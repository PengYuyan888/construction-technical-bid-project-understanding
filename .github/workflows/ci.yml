name: 自动检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 Skill 和测试文件
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          name = "construction-technical-bid-project-understanding"
          skill = Path("SKILL.md").read_text(encoding="utf-8")
          assert re.search(rf"^name:\s*{re.escape(name)}\s*$", skill, re.MULTILINE)
          frontmatter = skill.split("---", 2)[1]
          assert "description:" in frontmatter
          assert re.search(r"^license:\s*MIT\s*$", frontmatter, re.MULTILINE)
          assert "compatibility:" in frontmatter
          assert re.search(r'^\s*version:\s*["\']?1\.1\.0["\']?\s*$', frontmatter, re.MULTILINE)

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          assert package["name"] == name
          assert package["version"] == "1.1.0"
          assert package["license"] == "MIT"
          assert "Agent Skill" in package["description"]
          assert Path("agents/generic-prompt.md").is_file()

          evals = json.loads(Path("evals/evals.json").read_text(encoding="utf-8"))
          assert evals["skill_name"] == name
          assert len(evals["evals"]) >= 5
          ids = [item["id"] for item in evals["evals"]]
          assert len(ids) == len(set(ids))
          for item in evals["evals"]:
              assert item["prompt"] and item["expected_output"]
              assert isinstance(item["files"], list)
              assert item["expectations"]

          triggers = json.loads(Path("evals/trigger-evals.json").read_text(encoding="utf-8"))
          assert any(item["should_trigger"] for item in triggers)
          assert any(not item["should_trigger"] for item in triggers)
          PY

      - name: 检查安装器和 npm 包
        shell: bash
        run: |
          node --check bin/install.cjs
          npm pack --dry-run

      - name: 隔离安装、更新和跨 Agent 目录测试
        shell: bash
        run: |
          skill="construction-technical-bid-project-understanding"
          user_home="$RUNNER_TEMP/user-home"
          mkdir -p "$user_home"

          HOME="$user_home" node bin/install.cjs
          test -f "$user_home/.agents/skills/$skill/SKILL.md"
          if HOME="$user_home" node bin/install.cjs; then exit 1; fi
          HOME="$user_home" node bin/install.cjs --force
          find "$user_home/.agent-skill-backups/$skill" -mindepth 1 -maxdepth 1 -type d | grep .
          if find "$user_home/.agents/skills" -maxdepth 1 -type d -name "$skill.backup-*" | grep .; then exit 1; fi

          HOME="$user_home" node bin/install.cjs --agent codex
          HOME="$user_home" node bin/install.cjs --agent claude-code
          HOME="$user_home" node bin/install.cjs --agent cursor
          HOME="$user_home" node bin/install.cjs --agent gemini-cli
          HOME="$user_home" node bin/install.cjs --agent github-copilot
          test -f "$user_home/.codex/skills/$skill/SKILL.md"
          test -f "$user_home/.claude/skills/$skill/SKILL.md"
          test -f "$user_home/.cursor/skills/$skill/SKILL.md"
          test -f "$user_home/.gemini/skills/$skill/SKILL.md"
          test -f "$user_home/.copilot/skills/$skill/SKILL.md"

          node bin/install.cjs --scope project --project-root "$RUNNER_TEMP/project"
          test -f "$RUNNER_TEMP/project/.agents/skills/$skill/SKILL.md"
          node bin/install.cjs --target "$RUNNER_TEMP/custom-skills"
          test -f "$RUNNER_TEMP/custom-skills/$skill/SKILL.md"
          node bin/install.cjs --codex-home "$RUNNER_TEMP/legacy-codex"
          test -f "$RUNNER_TEMP/legacy-codex/skills/$skill/SKILL.md"

          detected_home="$RUNNER_TEMP/detected-home"
          mkdir -p "$detected_home/.codex" "$detected_home/.claude" "$detected_home/.cursor" "$detected_home/.gemini" "$detected_home/.copilot"
          HOME="$detected_home" node bin/install.cjs --all-detected
          test -f "$detected_home/.codex/skills/$skill/SKILL.md"
          test -f "$detected_home/.claude/skills/$skill/SKILL.md"
          test -f "$detected_home/.cursor/skills/$skill/SKILL.md"
          test -f "$detected_home/.gemini/skills/$skill/SKILL.md"
          test -f "$detected_home/.copilot/skills/$skill/SKILL.md"
